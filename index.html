<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ôn Tập Môn Sử GK1 - Lớp 12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-full flex flex-col justify-between antialiased selection:bg-indigo-500 selection:text-white overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md shrink-0 z-30">
        <div class="max-w-7xl mx-auto px-3 py-2 flex justify-between items-center gap-2">
            <div>
                <h1 class="text-sm sm:text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                    📜 Lịch Sử GK1 (12)
                </h1>
            </div>
            <div class="flex items-center gap-2">
                <div id="timerDisplay" class="bg-slate-700/80 px-2 py-1 rounded-lg text-xs font-mono text-cyan-300 border border-slate-600">
                    ⏱️ 00:00
                </div>
                <button onclick="confirmSubmitQuiz()" class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition active:scale-95">
                    Nộp Bài 🚀
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container Layout (Fixed Height, No Page Scrolling) -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 grid grid-cols-1 lg:grid-cols-4 gap-2 overflow-hidden">
        
        <!-- Question Card Area (Azota Mobile Style: Fixed frame with pinned bottom nav) -->
        <section class="lg:col-span-3 flex flex-col bg-slate-800/90 backdrop-blur-md border border-slate-700/80 rounded-xl shadow-xl overflow-hidden h-full">
            
            <!-- Toolbar / Filter Bar -->
            <div class="bg-slate-800 p-2.5 border-b border-slate-700 flex items-center justify-between gap-2 shrink-0 text-xs">
                <div class="flex items-center gap-2 truncate">
                    <span id="questionCategoryBadge" class="px-2 py-0.5 rounded-full font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 truncate">
                        Đề cương (6-7đ)
                    </span>
                    <span id="questionProgressText" class="text-slate-400 font-medium shrink-0">1/75</span>
                </div>
                <button onclick="toggleBookmark()" id="bookmarkBtn" class="px-2 py-1 rounded-lg bg-slate-700 text-slate-300 text-xs transition flex items-center gap-1 border border-slate-600">
                    ⭐ <span class="hidden sm:inline">Lưu</span>
                </button>
            </div>

            <!-- Scrollable Content Area (Question + Options) -->
            <div class="p-3 sm:p-5 flex-1 overflow-y-auto custom-scrollbar flex flex-col justify-between">
                <div>
                    <h2 id="questionTitle" class="text-sm sm:text-lg font-semibold text-slate-100 leading-snug mb-3">
                        Đang tải câu hỏi...
                    </h2>

                    <!-- Options Container -->
                    <div id="optionsContainer" class="space-y-2">
                        <!-- Options generated dynamically -->
                    </div>
                </div>

                <!-- Explanation Box -->
                <div id="explanationBox" class="mt-3 p-3 rounded-lg bg-slate-900/90 border border-slate-700/60 hidden text-xs text-slate-300">
                    <span class="font-bold text-cyan-400 block mb-0.5">💡 Giải thích:</span>
                    <p id="explanationText"></p>
                </div>
            </div>

            <!-- Fixed Bottom Navigation Bar inside Card (Never moves off-screen, no need to scroll down) -->
            <div class="p-2.5 sm:p-3 bg-slate-800 border-t border-slate-700 flex items-center justify-between shrink-0">
                <button onclick="prevQuestion()" class="px-3.5 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium text-xs transition disabled:opacity-30 disabled:cursor-not-allowed" id="prevBtn">
                    ← Câu trước
                </button>
                <div class="text-[11px] text-slate-400 hidden sm:block">
                    Dùng phím ← → hoặc bấm bảng bên phải.
                </div>
                <button onclick="nextQuestion()" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs transition shadow" id="nextBtn">
                    Câu tiếp →
                </button>
            </div>
        </section>

        <!-- Right Sidebar: Question Palette & Stats (Compact on mobile) -->
        <aside class="lg:col-span-1 bg-slate-800/90 backdrop-blur-md border border-slate-700/80 rounded-xl shadow-xl flex flex-col h-28 lg:h-full overflow-hidden shrink-0">
            <div class="px-3 py-1.5 bg-slate-800 border-b border-slate-700 flex justify-between items-center shrink-0">
                <span class="font-bold text-xs text-slate-200">📋 Bảng Câu Hỏi (75)</span>
                <span id="answeredCount" class="text-[10px] bg-cyan-500/20 text-cyan-300 px-2 py-0.5 rounded-full font-medium border border-cyan-500/30">0/75</span>
            </div>

            <!-- Filter tabs -->
            <div class="grid grid-cols-3 gap-1 px-2 py-1 bg-slate-900/50 text-[10px] font-medium text-slate-400 border-b border-slate-700 shrink-0">
                <button onclick="filterPalette('all')" id="filterAll" class="py-1 rounded bg-slate-700 text-white transition text-center">Tất cả</button>
                <button onclick="filterPalette('bookmarked')" id="filterBookmarked" class="py-1 rounded hover:bg-slate-700 text-center">Đã lưu ⭐</button>
                <button onclick="filterPalette('unanswered')" id="filterUnanswered" class="py-1 rounded hover:bg-slate-700 text-center">Chưa làm</button>
            </div>

            <!-- Question Grid Palette -->
            <div id="paletteGrid" class="p-1.5 sm:p-2 flex-1 overflow-y-auto custom-scrollbar grid grid-cols-10 lg:grid-cols-5 gap-1 content-start">
                <!-- Generated dynamically -->
            </div>
        </aside>

    </main>

    <!-- Modal Notification / Results -->
    <div id="customModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div id="modalContentBox" class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-5 shadow-2xl text-slate-100 transform transition-all scale-95 opacity-0 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <!-- Modal Header -->
            <div class="flex justify-between items-center pb-2.5 border-b border-slate-700">
                <h3 id="modalTitle" class="text-base font-bold text-indigo-400">Thông báo</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">&times;</button>
            </div>
            <!-- Modal Body -->
            <div id="modalBody" class="py-3 text-slate-300 text-xs sm:text-sm leading-relaxed">
                <!-- Content -->
            </div>
            <!-- Modal Footer -->
            <div id="modalFooter" class="flex justify-end gap-2 pt-2.5 border-t border-slate-700">
                <button onclick="closeModal()" class="px-3.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs font-medium text-slate-200 transition">Đóng</button>
            </div>
        </div>
    </div>

            }, 1000);
        }

            } else if (currentFilter === 'unanswered') {
                return questionsData.filter((q, idx) => userAnswers[idx] === null);
            }
            return questionsData;

            currentQuestionIndex = realIndex;

            if (targetQ.type === 'official') {

            } else {
                badge.innerText = `Dự đoán (Câu ${targetQ.id}/75)`;

            }

            document.getElementById('questionProgressText').innerText = `${realIndex + 1}/75`;
            document.getElementById('questionTitle').innerText = `${realIndex + 1}. ${targetQ.question}`;

            const bmBtn = document.getElementById('bookmarkBtn');
            if (bookmarked[realIndex]) {
                bmBtn.className = "px-2 py-1 rounded-lg bg-amber-600/30 text-amber-300 text-xs transition flex items-center gap-1 border border-amber-500/50";
                bmBtn.innerHTML = "⭐ <span class='hidden sm:inline'>Đã lưu</span>";
            } else {
                bmBtn.className = "px-2 py-1 rounded-lg bg-slate-700 text-slate-300 text-xs transition flex items-center gap-1 border border-slate-600";

            }

            const optsContainer = document.getElementById('optionsContainer');
            optsContainer.innerHTML = '';

            const isAnswered = userAnswers[realIndex] !== null;

            targetQ.options.forEach((opt, optIdx) => {
                const isSelected = userAnswers[realIndex] === optIdx;
                let btnClass = "w-full text-left p-2.5 sm:p-3 rounded-xl border transition flex items-center gap-2.5 text-xs sm:text-sm font-medium ";
                
                if (isSubmitted || isAnswered) {
                    if (optIdx === targetQ.correct) {
                        btnClass += "bg-emerald-600/20 border-emerald-500 text-emerald-200 shadow-sm";
                    } else if (isSelected && optIdx !== targetQ.correct) {

                    } else {

                    }
                } else {
                    if (isSelected) {
                        btnClass += "bg-indigo-600/30 border-indigo-500 text-indigo-200 shadow-sm ring-2 ring-indigo-500/30";
                    } else {
                        btnClass += "bg-slate-900/60 hover:bg-slate-700/50 border-slate-700 text-slate-300";
                    }
                }

                const letter = ['A', 'B', 'C', 'D'][optIdx];
                optsContainer.innerHTML += `
                    <button onclick="selectOption(${realIndex}, ${optIdx})" ${isSubmitted || isAnswered ? 'disabled' : ''} class="${btnClass}">
                        <span class="w-6 h-6 sm:w-7 sm:h-7 rounded-lg bg-slate-800 border border-slate-600 flex items-center justify-center font-bold text-xs shrink-0">${letter}</span>
                        <span class="flex-1">${opt}</span>
                    </button>
                `;
            });

            const expBox = document.getElementById('explanationBox');
            const expText = document.getElementById('explanationText');
            if (isSubmitted || isAnswered) {
                expBox.classList.remove('hidden');
                expText.innerText = targetQ.explanation;
            } else {
                expBox.classList.add('hidden');
            }

            const filteredList = getFilteredQuestions();
            const currentFilteredIdx = filteredList.findIndex(q => q.id === targetQ.id);
            document.getElementById('prevBtn').disabled = currentFilteredIdx <= 0;
            document.getElementById('nextBtn').disabled = currentFilteredIdx >= filteredList.length - 1;

            renderPalette();
            updateAnsweredCount();
        }

        function selectOption(realIndex, optIdx) {
            if (isSubmitted || userAnswers[realIndex] !== null) return;
            userAnswers[realIndex] = optIdx;

            if (fIndex === -1) fIndex = 0;
            loadQuestion(fIndex);
            renderPalette();
        }
